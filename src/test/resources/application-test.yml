server:
  shutdown: immediate

management.endpoint:
  health.cache.time-to-live: 0
  info.cache.time-to-live: 0

integration:
  hmpps-auth:
    url: "http://localhost:8090/auth"

spring:
  jpa:
    show-sql: true
    properties:
      hibernate.generate_statistics: true
  datasource:
    hikari:
      data-source-properties:
        sslmode: 'disable'

client:
  id: person-location
  secret: person-location

db:
  server: "localhost:5432"
  name: "person_location"
  user: "person"
  pass: "location"

hmpps.sqs:
  provider: localstack
  queues:
    hmppsdomaineventsqueue:
      queueName: ${random.uuid}
      dlqName: ${random.uuid}
      subscribeTopicId: hmppseventtopic
  topics:
    hmppseventtopic:
      arn: arn:aws:sns:eu-west-2:000000000000:${random.uuid}

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
